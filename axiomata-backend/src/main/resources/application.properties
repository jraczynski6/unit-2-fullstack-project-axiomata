spring.application.name=axiomata-backend

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/axiomata_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=axiomata_user

# read password from environment variable for security
spring.datasource.password=${AXIOMATA_DB_PASSWORD}

# MySQL driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT secret: 32+ bytes, random string
# DEV ONLY placeholder secret for JWT, not for production
jwt.secret=Z2+0k5t4j8eVb1QwLx+7s9y4mP6aS8fVdY2rB3nX0uE=
# 1 day in milliseconds
jwt.expiration=86400000

